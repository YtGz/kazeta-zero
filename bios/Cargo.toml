[package]
name = "kazeta-bios"
version = "0.2.0"
edition = "2021"

[dependencies]
macroquad = "0.4.14"
once_cell = "1.21.3"
gilrs = "0.11.0" # gamepad input library
futures = "0.3.30"
dirs = "6.0.0"
whoami = "1.4.1"
sysinfo = "0.36.0"
tar = "0.4.40"
flate2 = "1.0" # gzip compression/decompression
walkdir = "2.4.0"
chrono = { version = "0.4", features = ["serde"] } # clock
serde = { version = "1.0", features = ["derive"] } # for checking the splash screen setting
serde_json = "1.0" # I don't think I need this...
toml = "1.1" # loading custom themes (and for config.toml)
tokio = { version = "1.47.1", features = ["full"] }
rand = "0.10" # for generating a random message every time the BIOS loads
regex = "1" # parsing command output for fetching audio sinks
home = "0.5.10" # reliably find user's home directory
reqwest = { version = "0.13", features = ["blocking", "json"] } # handle HTTP requests
zip = "6.0.0" # handle zip extraction
tempfile = "3.23.0" # for downloading runtime files
kazeta-overlay = { path = "../overlay" } # overlay client for in-game notifications

# CD-ROM support
cd-da-reader = "0.1.0"
rodio = "0.21.1"

# video support
ffmpeg-next = "8.1"
image = "0.25.9"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"] } # bluetooth

[features]
default = []
dev = [] # add dev mode flag

# deprecated dependencies
#macroquad = { version = "0.4.14", features = ["audio"] }
