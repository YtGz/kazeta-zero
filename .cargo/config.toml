[patch.crates-io]
# Vendored miniquad with custom patches from the kazeta fork lineage:
#   - X11: text/uri-list drag-and-drop, unaligned XI2 raw value reads,
#     mouse enter/leave events, cursor icon/visibility tracking
#   - Wayland: keymap API updates, keymods tracking, libdecor resize caps
#   - macOS: nil checks for Cocoa APIs, swallowed Command-key-up events
#   - Windows: IME support for CJK input
# The vendored version is kept in sync with upstream (currently 0.4.11).
miniquad = { path = "vendor/miniquad" }
